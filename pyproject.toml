[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jeelink-davis"
version = "0.1.0"
description = "Python library for receiving Davis Vantage Pro 2 data via JeeLink USB receiver"
requires-python = ">=3.11"
dependencies = [
    "pyserial>=3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-mock>=3",
    "pytest-asyncio>=0.23",
]
web = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "astral>=3.2",
    "httpx>=0.27",
    "smbus2>=0.4",
    "RPi.bme280>=0.2",
    "influxdb-client>=1.40",
    "paho-mqtt>=2.0",
]
# There is deliberately NO [lightning] extra.
#
# The AS3935 needs the RPi.GPIO shim (rpi-lgpio) on top of the lgpio C library.
# Raspberry Pi OS ships both prebuilt as python3-rpi-lgpio and python3-lgpio,
# and taking them from apt is the right source: pip would rebuild the same C
# extension from source against the same liblgpio1, which needs swig and a
# toolchain that is not on a weather-station Pi. Tried on 2026-08-06 and it
# failed exactly there — `error: command 'swig' failed`.
#
# So the dependency is satisfied by apt, and update.sh points the venv at the
# system packages instead of installing anything. See "Lightning sensor" in
# README.md.
#
# rpi-lgpio is the *shim*, not RPi.GPIO. It provides the same `RPi.GPIO` import
# name on kernels without the sysfs GPIO interface; installing the real
# RPi.GPIO alongside it gives two packages claiming one name.

[tool.pytest.ini_options]
# The cache tests are async; without this they are silently skipped as
# "coroutine never awaited" rather than failing, which would make the
# single-flight guarantee untested while still reporting green.
asyncio_mode = "auto"

[tool.setuptools.packages.find]
where = ["."]
include = ["jeelink_davis*"]
