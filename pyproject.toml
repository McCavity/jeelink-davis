[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jeelink-davis"
version = "0.1.0"
description = "Python library for receiving Davis Vantage Pro 2 data via JeeLink USB receiver"
requires-python = ">=3.11"
dependencies = [
    "pyserial>=3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-mock>=3",
    "pytest-asyncio>=0.23",
]
web = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "astral>=3.2",
    "httpx>=0.27",
    "smbus2>=0.4",
    "RPi.bme280>=0.2",
    "influxdb-client>=1.40",
    "paho-mqtt>=2.0",
]
# Raspberry Pi only, and deliberately not part of [web]: rpi-lgpio pulls in the
# lgpio C library, which does not build on a development machine — putting it
# in [web] would break `pip install -e ".[dev,web]"` everywhere but the Pi.
#
# rpi-lgpio is the *shim*, not RPi.GPIO. It provides the same `RPi.GPIO` module
# name on kernels that no longer offer the sysfs GPIO interface. Installing the
# real RPi.GPIO alongside it gives two packages claiming one import name.
lightning = [
    "rpi-lgpio>=0.6",
]

[tool.pytest.ini_options]
# The cache tests are async; without this they are silently skipped as
# "coroutine never awaited" rather than failing, which would make the
# single-flight guarantee untested while still reporting green.
asyncio_mode = "auto"

[tool.setuptools.packages.find]
where = ["."]
include = ["jeelink_davis*"]
